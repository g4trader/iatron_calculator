name: Backend Cloud Run Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        type: choice
        required: true
        options:
          - staging
          - production
      service:
        description: "Cloud Run service name"
        required: true
        default: iatron-calculator-api
      region:
        description: "Cloud Run region"
        required: true
        default: us-central1

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      GCP_PROJECT_ID: stg1-508713
      CLOUD_RUN_SERVICE: ${{ inputs.service }}
      CLOUD_RUN_REGION: ${{ inputs.region }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run from source
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          origins = os.environ.get("CORS_ORIGINS", "").strip()
          if not origins:
              raise SystemExit("Configure CORS_ORIGINS in the GitHub environment before deploying.")
          Path(os.environ["RUNNER_TEMP"], "iatron-cloud-run-env.json").write_text(
              json.dumps({"CORS_ORIGINS": origins})
          )
          PY
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --source backend \
            --region "$CLOUD_RUN_REGION" \
            --port 8080 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 20 \
            --service-account "iatron-api-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --no-invoker-iam-check \
            --env-vars-file "$RUNNER_TEMP/iatron-cloud-run-env.json"
